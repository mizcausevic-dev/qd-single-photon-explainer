name: Enable GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/enable-pages.yml

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Point Pages at the pages branch
        env:
          CRSR_CLOUD: ${{ secrets.CRSR_CLOUD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          repo="${{ github.repository }}"
          if [ -n "${CRSR_CLOUD}" ]; then
            token="$CRSR_CLOUD"
            echo "token_source=CRSR_CLOUD"
          else
            token="$GITHUB_TOKEN"
            echo "token_source=GITHUB_TOKEN"
          fi
          try_method() {
            method="$1"
            code=$(curl -sS -o /tmp/pages-api.json -w "%{http_code}" -X "$method" \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${repo}/pages" \
              -d '{"build_type":"legacy","source":{"branch":"pages","path":"/"}}')
            body=$(tr '\n' ' ' < /tmp/pages-api.json | cut -c1-500)
            echo "${method} ${code} ${body}"
            echo "::warning title=pages-${method}::${code} ${body}"
            printf '%s' "$code" > /tmp/last-code
          }
          try_method POST
          post=$(cat /tmp/last-code)
          if [ "$post" != "201" ] && [ "$post" != "409" ]; then
            try_method PUT
            put=$(cat /tmp/last-code)
            if [ "$put" != "200" ] && [ "$put" != "201" ]; then
              exit 1
            fi
          fi
