name: assemble-explainer
on:
  push:
    branches: [pages]
    paths:
      - .github/workflows/assemble-explainer.yml
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages
      - name: write exact bundle
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -fsSL -o /tmp/a.bin 'https://paste.rs/SFrSZ'
          curl -fsSL -o /tmp/b.bin 'https://paste.rs/zt6XD'
          echo 'fd3286788938226c50384e6f37ea44739f10cb0a0bd5db54221ba3dca7d7944f  /tmp/a.bin' | sha256sum -c -
          echo '3f486ff49a0bf7e602c85a973e2b6afb7e63005e068ba15244404da966577ed6  /tmp/b.bin' | sha256sum -c -
          cat /tmp/a.bin /tmp/b.bin > assets/index-CPq1UiMp.js
          echo 'b78ffa21275c71d8c4580147524ec94f2b15ee456c125e770489d1d884a277d6  assets/index-CPq1UiMp.js' | sha256sum -c -
          test "$(wc -c < assets/index-CPq1UiMp.js)" -eq 528573
          if grep -q sourceMappingURL assets/index-CPq1UiMp.js; then
            echo 'source map marker present'
            exit 1
          fi
          rm -f .github/workflows/assemble-explainer.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then
            echo 'bundle already present'
            exit 0
          fi
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git commit -m 'Publish the static explainer on the pages branch.'
          git push origin HEAD:pages
